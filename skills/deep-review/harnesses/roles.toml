# Native reviewer agent roles. Each role generates one agent per declared
# harness, named "deep-review-<role>" everywhere. The installer
# generates them; they are gitignored. Regenerate locally with
# `python scripts/generate_agents.py` after editing this file or a body.

[roles.scout]
description = "Read-only deep-review scout using one selected review lens."
body = ["reviewers/SCOUT.md"]

[roles.scout.codex]
model = "gpt-6-luna"
model_reasoning_effort = "high"
sandbox_mode = "read-only"

[roles.scout.devin]
model = "gpt-6-sol-medium"
allowed-tools = ["read", "grep", "glob", "exec"]

[roles.scout.claude]
model = "claude-sonnet-5-5"
tools = ["Read", "Grep", "Glob", "Bash"]
effort = "high"

[roles.structural]
description = "Read-only deep-review structural maintainability scout."
body = ["reviewers/SCOUT.md", "reviewers/lenses/structural.md"]

[roles.structural.codex]
model = "gpt-6.1-sol"
model_reasoning_effort = "high"
sandbox_mode = "read-only"

[roles.structural.devin]
model = "gpt-6-sol-medium"
allowed-tools = ["read", "grep", "glob", "exec"]

[roles.structural.claude]
model = "claude-opus-5-5"
tools = ["Read", "Grep", "Glob", "Bash"]
effort = "high"

[roles.validator-static]
description = "Read-only independent adjudicator for one deep-review hypothesis."
body = ["reviewers/validator.md"]

[roles.validator-static.codex]
model = "gpt-6.1-sol"
model_reasoning_effort = "high"
sandbox_mode = "read-only"

[roles.validator-static.devin]
model = "gpt-6-sol-high"
allowed-tools = ["read", "grep", "glob", "exec"]

[roles.validator-static.claude]
model = "claude-opus-5-5"
tools = ["Read", "Grep", "Glob", "Bash"]
effort = "high"

[roles.validator-probe]
description = "Independent adjudicator for one bounded writable deep-review probe."
body = ["reviewers/validator.md"]

[roles.validator-probe.codex]
model = "gpt-6-luna"
model_reasoning_effort = "high"
sandbox_mode = "workspace-write"

[roles.validator-probe.devin]
model = "gpt-6-sol-high"
allowed-tools = ["read", "grep", "glob", "exec", "write", "edit"]

[roles.validator-probe.claude]
model = "claude-sonnet-5-5"
tools = ["Read", "Grep", "Glob", "Bash", "Edit", "Write"]
effort = "high"
