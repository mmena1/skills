# Native reviewer agent roles. Each role generates one agent per declared
# harness, named "deep-review-<role>" everywhere. The installer
# generates them; they are gitignored. Regenerate locally with
# `python scripts/generate_agents.py` after editing this file or a body.
#
# Each scout role embeds the common scout contract followed by exactly one
# lens from reviewers/lenses/. Validators embed the validator contract.

[roles.scout-bugs]
description = "Read-only deep-review scout using the bugs lens."
body = ["reviewers/SCOUT.md", "reviewers/lenses/bugs.md"]

[roles.scout-bugs.codex]
model = "gpt-6.1-sol"
model_reasoning_effort = "high"

[roles.scout-bugs.devin]
model = "gpt-6-1-sol-high"
allowed-tools = ["read", "grep", "glob", "exec"]

[roles.scout-bugs.claude]
model = "claude-opus-5-5"
tools = ["Read", "Grep", "Glob", "Bash"]
effort = "high"

